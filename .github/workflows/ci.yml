name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # warehouse-dependent tests skip when this file does not exist; dbt parse never opens it
      TRADEWAR_DB: /tmp/ci/tradewar.duckdb
      PBIR_SCHEMA_CACHE: /tmp/pbir-schemas
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: pip install -r requirements-ci.txt

      - name: Secret scan (working tree)
        run: python tools/secret_scan.py
      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: pytest -q

      - name: PBIP builder is reproducible (generated TMDL/PBIR match the commit)
        run: |
          python powerbi/build_pbip.py
          git diff --stat --exit-code -- powerbi ':(exclude)powerbi/TradeWar.SemanticModel/definition/expressions.tmdl'

      - name: Validate PBIR JSON against Microsoft's published schemas
        run: python powerbi/validate_pbir.py

      - name: dbt parse (models, tests, sources compile into a manifest)
        working-directory: dbt
        run: dbt parse --profiles-dir .
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # CI works on a copy of the committed warehouse, rebuilt by dbt from the committed data/raw snapshots.
      TRADEWAR_DB: /tmp/ci/tradewar.duckdb
      TRADEWAR_REQUIRE_DB: "1"   # warehouse/ML/SQL tests must run, not skip
      PBIR_SCHEMA_CACHE: /tmp/pbir-schemas
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: pip install -r requirements-ci.txt

      - name: Secret scan (working tree)
        run: python tools/secret_scan.py
      - name: Lint (ruff)
        run: ruff check .

      - name: PBIP builder is reproducible (generated TMDL/PBIR match the commit)
        run: |
          python powerbi/build_pbip.py
          git diff --stat --exit-code -- powerbi ':(exclude)powerbi/TradeWar.SemanticModel/definition/expressions.tmdl'

      - name: Validate PBIR JSON against Microsoft's published schemas
        run: python powerbi/validate_pbir.py

      - name: dbt build on the committed data/raw (seeds, models, data tests)
        working-directory: dbt
        run: |
          mkdir -p /tmp/ci && cp ../warehouse/tradewar.duckdb /tmp/ci/tradewar.duckdb
          dbt build --profiles-dir . --threads 1

      - name: Tests (pytest, incl. warehouse, ML-output and SQL-analysis tests)
        run: pytest -q -rs

name: tradewar
version: "1.0.0"
config-version: 2
profile: tradewar

model-paths: ["models"]
seed-paths: ["../seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
on-run-start:
  - "{{ check_raw_root() }}"

clean-targets: ["target", "dbt_packages"]

vars:
  # Relative to the dbt/ folder (run dbt from there); override with env TRADEWAR_RAW=<abs path to data/raw>.
  raw_root: "{{ env_var('TRADEWAR_RAW', '../data/raw') }}"
  baseline_year: 2024
  before_start: "2024-01-01"      # "Before" window = calendar 2024
  before_end: "2024-12-31"
  after_start: "2025-04-01"       # "After" window = Liberation Day month onward
  prewar_date: "2026-02-27"       # last trading day before the Iran war
  war_start: "2026-02-28"
  us_households_m: 132.2          # US households (millions), Census CPS/ASEC 2024 - used for per-household duty cost

models:
  tradewar:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      core:
        +schema: core
      powerbi:
        +schema: powerbi

seeds:
  tradewar:
    +schema: seeds
    tariff_events:
      +column_types: {event_date: date, effective_date: date, rate_pct: double, verified: boolean}
    tariff_headline_schedule:
      +column_types: {start_date: date, end_date: date, headline_rate_pct: double, verified: boolean, basis: varchar, source_url: varchar, country_iso3: varchar}
    war_events:
      +column_types: {event_date: date, brent_usd: double, verified: boolean}
    cpi_category_map:
      +column_types: {is_headline: boolean}
    event_phases:
      +column_types: {start_date: date, end_date: date, phase_order: integer}
